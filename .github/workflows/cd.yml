name: CD

on:
  push:
    branches: [main]

jobs:
  Deploy:
    runs-on: ubuntu-latest

    steps:
      # checkout the code
      - name: checkout code
        uses: actions/checkout@v4

      # setup-go
      - name: setup go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.1"

      # run production build
      - name: build production
        run: ./scripts/buildprod.sh
